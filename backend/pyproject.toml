[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: isolated checks without database requests",
    "integration: API and migrated database behavior",
    "postgres: PostgreSQL-specific database guarantees",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["app"]
