name: Release readiness (PLN-36)

on:
  pull_request:
    paths: ["scripts/verify_release.py", "backend/tests/test_release_verification.py", ".github/workflows/release-readiness.yml"]
  push:
    branches: ["feature/pln-36-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release version to verify on main (no publication)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify the candidate validator
        working-directory: backend
        run: python -m pytest -q tests/test_release_verification.py

  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the actual main candidate
        uses: actions/checkout@v4
        with:
          ref: main
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate candidate version metadata before building
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from verify_release import check_source, require
          version = os.environ["RELEASE_VERSION"]
          require(re.fullmatch(r"v\d+\.\d+\.\d+", version), "Invalid release version")
          check_source(Path("candidate"), version)
          require(Path("candidate/backend/scripts/generate_release_report.py").is_file(), "Merge the report-generator contribution before candidate verification")
          PY
      - name: Install candidate renderer and backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi8 shared-mime-info fonts-dejavu-core
          python -m pip install -r candidate/backend/requirements-dev.txt
      - name: Generate the candidate report in its isolated database
        working-directory: candidate/backend
        run: |
          CANDIDATE_COMMIT=$(git rev-parse HEAD)
          python scripts/generate_release_report.py --version "$RELEASE_VERSION" --commit "$CANDIDATE_COMMIT" --output-dir ../../release-bundle
      - name: Build candidate Docker images locally
        run: |
          docker build -t "sds06/backend:$RELEASE_VERSION" candidate/backend
          docker build -t "sds06/frontend:$RELEASE_VERSION" candidate/frontend
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          images = []
          for component in ("backend", "frontend"):
              tag = f"sds06/{component}:{os.environ['RELEASE_VERSION']}"
              info = json.loads(subprocess.check_output(["docker", "image", "inspect", tag]))[0]
              images.append({"component": component, "tag": tag, "image_id": info["Id"]})
          Path("built-images.json").write_text(json.dumps(images))
          PY
      - name: Validate artifacts and create manifest and checksums
        run: |
          CANDIDATE_COMMIT=$(git -C candidate rev-parse HEAD)
          python scripts/verify_release.py --root candidate --bundle release-bundle --images built-images.json --version "$RELEASE_VERSION" --commit "$CANDIDATE_COMMIT" --output release-bundle
      - name: Upload verified candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-candidate
          path: release-bundle/
          retention-days: 14
          if-no-files-found: error
