name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy app
      - name: Workflow and metrics unit coverage (PLN-35)
        run: |
          COVERAGE_FILE=.coverage-unit python -m pytest -q -m unit --cov=app.main --cov=app.runs --cov=app.metrics --cov-report=term-missing --cov-report=json:unit-coverage.json --cov-report=xml:unit-coverage.xml
          python scripts/check_unit_coverage.py unit-coverage.json
      - name: Upload unit coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-metrics-unit-coverage
          path: |
            backend/unit-coverage.json
            backend/unit-coverage.xml
          retention-days: 14
      - name: Pytest and Cobertura coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml -o junit_family=legacy
      - name: Import CI reports into isolated SDS-06 (PLN-23)
        env:
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python scripts/dogfood_ci.py --junit junit.xml --coverage coverage.xml --commit "$REPORT_COMMIT" --branch "$REPORT_BRANCH"
      - name: Upload CI import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-import-evidence
          path: |
            backend/junit.xml
            backend/dogfood-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload SQLite Cobertura report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-sqlite
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  backend-postgres:
    name: Backend PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sds06
          POSTGRES_PASSWORD: sds06
          POSTGRES_DB: sds06_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sds06 -d sds06_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://sds06:sds06@localhost:5432/sds06_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Pytest on PostgreSQL and Cobertura coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml -o junit_family=legacy
      - name: Upload PostgreSQL Cobertura report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-postgres
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
